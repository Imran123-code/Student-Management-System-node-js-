<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS</title>
    <link rel="stylesheet" href="/public/style.css">
</head>

<body>
    <div class="homeContainer">
        <div class="contentSection">
            <div class="AppName">
                Student Management
            </div>
            <div class="bigContent">
                <h1>Welcome to Student Management System</h1>
            </div>
            <div class="smallContent">Manage student records easily in one place. Register new students, view all
                records,
                update and delete anytime.</div>

            <form action="/register" method="POST" class="buttonsCont">
                <button type="submit">Register New Student</button>
                <button type="submit">View students</button>
            </form>
        </div>
        <div class="logoSection">
            <img src="/Assets/logo.png" alt="Student Management System">
        </div>

    </div>
    <div class="lowerSection">
        <div class="lower1">
            <div class="logo">
                <img src="/Assets/images.jpg" alt="LOGO">
            </div>
            <div class="lContent">
                <p class="p1">Total students</p>
                <p>count</p>
            </div>
        </div>
        <div class="lower1">
            <div class="logo">
                <img src="/Assets/images.jpg" alt="LOGO">
            </div>
            <div class="lContent">
                <p class="p1">Register students</p>
                <p>Add new student to the System</p>
            </div>
        </div>

        <div class="lower1">
            <div class="logo">
                <img src="/Assets/images.jpg" alt="LOGO">
            </div>
            <div class="lContent">
                <p class="p1">View records </p>
                <p>see all registered students</p>
            </div>
        </div>
    </div>
</body>

</html>
